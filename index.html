<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>پنل پیج‌ها</title>
  <meta name="description" content="داشبورد آمار پنج پیج در اینستاگرام، یوتیوب، آپارات و تیک‌تاک">
  <meta name="theme-color" content="#f7f5fc">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("sp_theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
      if (t === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#120e1c");
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="پنل پیج‌ها">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="loading">در حال بارگذاری…</div>
  </main>
  <noscript><p class="loading">برای دیدن این پنل، جاوااسکریپت را فعال کنید.</p></noscript>
  <script src="app.js?v=6" defer></script>
</body>
</html>
