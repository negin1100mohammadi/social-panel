name: Refresh stats & deploy

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # asks every 15 min; GitHub drops/delays many scheduled runs, so this lands near every 30 min
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"          # data commits are deployed by the run that made them
      - "queue/**"         # publish queue is handled by publish.yml
      - "config/**"        # encrypted token sync file; read from the GitHub API, not from Pages
      - "vault/**"         # encrypted brain/gallery/publish data (contents API only)
      - "inbox/**"         # encrypted gallery inbox (gallery-ingest.yml)
      - "hark/**"          # encrypted Hark <-> panel channel (hark/requests, hark/out)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pillow cryptography

      - name: Fetch stats
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}          # connected YouTube channels (exact stats + comments)
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/fetch_stats.py

      - name: Commit data changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh stats $(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M') Tehran"
            # other workflows (yt-connect, yt-reply, publish, the panel) also push to main: rebase + retry
            for i in 1 2 3 4 5; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep $((i*3)); done
            exit 1
          fi

  deploy:
    needs: [refresh]
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, including the data just pushed

      - name: Build site folder
        run: |
          mkdir -p _site
          cp -r index.html oauth.html app.js styles.css sw.js manifest.json config.json favicon.png icons data _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
