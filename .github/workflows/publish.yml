name: Publish queued posts

on:
  push:
    branches: [main]
    paths:
      - "queue/**"
  schedule:
    - cron: "*/15 * * * *"   # scheduled posts (GitHub may delay cron runs by a few minutes)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # v30.2: never work on the triggering (possibly stale) SHA — always the newest main
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync to latest main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main
          git reset -q --hard origin/main
          git log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Publish due jobs
        env:
          # one secret per page/platform (<PAGE> = page id upper-cased, '-' -> '_'); a new page needs its lines here too
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v30.2 race guard: publish.py re-reads newest main and pushes a "publishing" lock per target before any remote call
          SP_GIT_SYNC: "1"
          SP_GIT_BRANCH: main
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}   # decrypts config/yt_tokens.enc.json (connected YouTube channels)
          IG_ACCESS_TOKEN_HAMRAH_SELLER: ${{ secrets.IG_ACCESS_TOKEN_HAMRAH_SELLER }}
          IG_USER_ID_HAMRAH_SELLER: ${{ secrets.IG_USER_ID_HAMRAH_SELLER }}
          APARAT_USER_HAMRAH_SELLER: ${{ secrets.APARAT_USER_HAMRAH_SELLER }}
          APARAT_PASS_HAMRAH_SELLER: ${{ secrets.APARAT_PASS_HAMRAH_SELLER }}
          TIKTOK_ACCESS_TOKEN_HAMRAH_SELLER: ${{ secrets.TIKTOK_ACCESS_TOKEN_HAMRAH_SELLER }}
          IG_ACCESS_TOKEN_TITAN_STATION: ${{ secrets.IG_ACCESS_TOKEN_TITAN_STATION }}
          IG_USER_ID_TITAN_STATION: ${{ secrets.IG_USER_ID_TITAN_STATION }}
          APARAT_USER_TITAN_STATION: ${{ secrets.APARAT_USER_TITAN_STATION }}
          APARAT_PASS_TITAN_STATION: ${{ secrets.APARAT_PASS_TITAN_STATION }}
          TIKTOK_ACCESS_TOKEN_TITAN_STATION: ${{ secrets.TIKTOK_ACCESS_TOKEN_TITAN_STATION }}
          IG_ACCESS_TOKEN_FANCATSTIC_FOUR: ${{ secrets.IG_ACCESS_TOKEN_FANCATSTIC_FOUR }}
          IG_USER_ID_FANCATSTIC_FOUR: ${{ secrets.IG_USER_ID_FANCATSTIC_FOUR }}
          APARAT_USER_FANCATSTIC_FOUR: ${{ secrets.APARAT_USER_FANCATSTIC_FOUR }}
          APARAT_PASS_FANCATSTIC_FOUR: ${{ secrets.APARAT_PASS_FANCATSTIC_FOUR }}
          TIKTOK_ACCESS_TOKEN_FANCATSTIC_FOUR: ${{ secrets.TIKTOK_ACCESS_TOKEN_FANCATSTIC_FOUR }}
          IG_ACCESS_TOKEN_SHODE_DIGE: ${{ secrets.IG_ACCESS_TOKEN_SHODE_DIGE }}
          IG_USER_ID_SHODE_DIGE: ${{ secrets.IG_USER_ID_SHODE_DIGE }}
          APARAT_USER_SHODE_DIGE: ${{ secrets.APARAT_USER_SHODE_DIGE }}
          APARAT_PASS_SHODE_DIGE: ${{ secrets.APARAT_PASS_SHODE_DIGE }}
          TIKTOK_ACCESS_TOKEN_SHODE_DIGE: ${{ secrets.TIKTOK_ACCESS_TOKEN_SHODE_DIGE }}
          IG_ACCESS_TOKEN_PRETIME_TV: ${{ secrets.IG_ACCESS_TOKEN_PRETIME_TV }}
          IG_USER_ID_PRETIME_TV: ${{ secrets.IG_USER_ID_PRETIME_TV }}
          APARAT_USER_PRETIME_TV: ${{ secrets.APARAT_USER_PRETIME_TV }}
          APARAT_PASS_PRETIME_TV: ${{ secrets.APARAT_PASS_PRETIME_TV }}
          TIKTOK_ACCESS_TOKEN_PRETIME_TV: ${{ secrets.TIKTOK_ACCESS_TOKEN_PRETIME_TV }}
          # Buffer route for Instagram/TikTok (pages whose channels data/buffer.json lists); same keys as buffer-sync.yml
          BUFFER_KEY_HAMRAH_SELLER: ${{ secrets.BUFFER_KEY_HAMRAH_SELLER }}
          BUFFER_KEY_TITAN_STATION: ${{ secrets.BUFFER_KEY_TITAN_STATION }}
          BUFFER_KEY_FANCATSTIC_FOUR: ${{ secrets.BUFFER_KEY_FANCATSTIC_FOUR }}
          BUFFER_KEY_SHODE_DIGE: ${{ secrets.BUFFER_KEY_SHODE_DIGE }}
          BUFFER_KEY_PRETIME_TV: ${{ secrets.BUFFER_KEY_PRETIME_TV }}
        run: python scripts/publish.py

      # queue results are pushed by publish.py itself (per target); this only saves publish_caps.json.
      # It fails loudly instead of silently dropping a status (2026-11-21: a rebase conflict lost YouTube/TikTok results).
      - name: Commit publish caps
        if: always()
        run: |
          if [ -f config/publish_caps.json ]; then git add config/publish_caps.json; fi
          if git diff --cached --quiet; then
            echo "No caps changes."
          else
            git commit -q -m "publish: caps $(TZ=Asia/Tehran date '+%Y-%m-%d %H:%M') Tehran"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then ok=1; break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::publish_caps.json could not be pushed"; exit 1; }
          fi
