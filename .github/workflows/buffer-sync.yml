name: buffer-sync
on:
  workflow_dispatch:
  schedule:
    - cron: "41 */3 * * *"
permissions:
  contents: write
concurrency: { group: data-write, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/buffer_sync.py
        env:
          BUFFER_KEY_HAMRAH_SELLER: ${{ secrets.BUFFER_KEY_HAMRAH_SELLER }}
          BUFFER_KEY_TITAN_STATION: ${{ secrets.BUFFER_KEY_TITAN_STATION }}
          BUFFER_KEY_FANCATSTIC_FOUR: ${{ secrets.BUFFER_KEY_FANCATSTIC_FOUR }}
          BUFFER_KEY_SHODE_DIGE: ${{ secrets.BUFFER_KEY_SHODE_DIGE }}
          BUFFER_KEY_PRETIME_TV: ${{ secrets.BUFFER_KEY_PRETIME_TV }}
      - run: |
          git config user.name "panel-bot"; git config user.email "panel-bot@users.noreply.github.com"
          git add data/buffer.json && git commit -m "buffer sync" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
